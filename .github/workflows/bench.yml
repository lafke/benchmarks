name: Benchmark

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Measured runs for corpora that are timed
        default: "5"
      lafke-version:
        description: lafke release tag to measure, such as v0.1.0 (empty for the latest)
        default: ""
      corpora:
        description: Comma-separated corpus names to run (empty for all)
        default: ""
  # Sent by lafke/engine-releases once a new engine release is published.
  repository_dispatch:
    types: [engine-release]
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC
  push:
    branches: [main]
    paths:
      - cmd/**
      - corpora.json
      - go.*
      - .github/workflows/bench.yml

permissions:
  contents: read

jobs:
  plan:
    name: List the corpora
    runs-on: ubuntu-latest
    outputs:
      corpora: ${{ steps.list.outputs.corpora }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no dependencies to cache
      - id: list
        env:
          SELECTED: ${{ inputs.corpora }}
        run: |
          set -euo pipefail
          all=$(go run ./cmd/bench -list)
          if [ -n "$SELECTED" ]; then
            all=$(jq -c --arg s "$SELECTED" '[ .[] | select(. as $n | ($s | split(",") | map(gsub(" "; "")) | index($n))) ]' <<<"$all")
          fi
          echo "corpora=$all" >> "$GITHUB_OUTPUT"

  bench:
    name: ${{ matrix.corpus }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false # one corpus failing must not hide the others
      matrix:
        corpus: ${{ fromJSON(needs.plan.outputs.corpora) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install lafke and the engine
        env:
          GH_TOKEN: ${{ github.token }} # the installer verifies the release attestation with gh
          INSTALL_DIR: ${{ runner.temp }}/lafke-bin
          VERSION: ${{ inputs.lafke-version }}
          ENGINE_TAG: ${{ github.event.client_payload.tag }} # empty unless an engine release started this run
        run: |
          set -euo pipefail
          mkdir -p "$INSTALL_DIR"
          curl -fsSL https://lafke.sh/install | sh
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          if [ -n "$ENGINE_TAG" ]; then
            case "$ENGINE_TAG" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "invalid engine tag: $ENGINE_TAG" >&2; exit 1 ;;
            esac
            # Measure the release that triggered the run, not whatever is newest by now.
            "$INSTALL_DIR/lafke" engine install --version "$ENGINE_TAG"
            echo "LAFKE_ENGINE_VERSION=$ENGINE_TAG" >> "$GITHUB_ENV"
          fi
      # The corpora are pinned to a commit, so what is fetched only changes with corpora.json.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: corpora-${{ matrix.corpus }}-${{ hashFiles('corpora.json') }}
      - name: Run the benchmark
        env:
          RUNS: ${{ inputs.runs || '5' }}
          CORPUS: ${{ matrix.corpus }}
        # The summary is written once, by the last job, from all the results.
        run: go run ./cmd/bench -only "$CORPUS" -runs "$RUNS" -out results -summary=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.corpus }}
          path: results/*.json
          if-no-files-found: error
          retention-days: 1 # only handed to the summary job

  report:
    name: Summary
    needs: bench
    if: ${{ !cancelled() && needs.bench.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      - name: Write the job summary
        run: go run ./cmd/bench -merge results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: results/*.json
